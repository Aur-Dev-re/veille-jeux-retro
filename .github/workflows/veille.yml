name: Veille Jeux Rétro

# Déclenchement :
# - automatiquement toutes les 2 heures (fréquence raisonnable, non agressive)
# - manuellement depuis l'onglet "Actions" de GitHub, pour tester à la demande
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Envoyer une notification de test ntfy (vérification de bout en bout)"
        type: boolean
        default: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la veille
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          TEST_NOTIFICATION: ${{ github.event.inputs.test_notification }}
        run: python scripts/main.py

      - name: Sauvegarder l'état de la veille (annonces déjà vues)
        run: |
          git config user.name "Veille Jeux Rétro (bot)"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_listings.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique de l'état de la veille"
            git push
          else
            echo "Rien à sauvegarder."
          fi
