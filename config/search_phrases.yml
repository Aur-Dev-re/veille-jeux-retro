# ==================================================================
# Champ lexical de la veille — RECHERCHES
# ==================================================================
# Ce fichier est configurable : tu peux ajouter, modifier ou supprimer des
# entrées librement, sans toucher au code. Une entrée par ligne, précédée d'un tiret.
#
# Organisation en 3 groupes (les recherches vagues et contextuelles sont
# prioritaires, car elles trouvent les annonces que les autres acheteurs
# manquent) :
#   1. recherches_precises      -> noms de consoles / jeux / licences
#   2. recherches_vagues        -> annonces mal décrites, vocabulaire flou
#   3. recherches_contextuelles -> vocabulaire d'un vendeur qui ne connaît pas
#                                  l'objet, s'en débarrasse, l'a retrouvé, etc.
# ==================================================================

recherches_precises:
